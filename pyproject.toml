[project]
name = "abeliantensors"
version = "0.2.0"
description = "Library for Abelian symmetry preserving tensors."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Hauru", email = "markus@mhauru.org" }]
keywords = ["tensor", "tensor networks", "linear algebra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.urls]
Homepage = "https://github.com/smorita/abeliantensors"
Upstream = "https://github.com/mhauru/abeliantensors"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-randomly",
    "pytest-cov",
    "ncon>=2",
    "ruff",
    "pyright>=1.1.414",
]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
demo = ["ncon>=2", "matplotlib", "seaborn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 79
# Plans/specs contain illustrative code blocks, not project code.
extend-exclude = ["docs/superpowers"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "NPY", "B",
    # Type annotations on the public API of src/ (see the typing spec).
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN204", "ANN205", "ANN206",
]
ignore = [
    # Tests rely on the legacy global RNG seeded by pytest-randomly.
    "NPY002",
    # zip(strict=True) would raise where code may rely on truncation;
    # adding it is a behavior change, out of scope for the modernization.
    "B905",
    # Remaining %-formats use %r/%i flags in __repr__ and warnings; leave
    # them as they are rather than hand-rewrite the output formats.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# `l` is used conventionally for lists of indices/legs.
"src/**" = ["E741"]
"tests/**" = ["E741", "ANN"]
"demo/**" = ["ANN"]
"benchmarks/**" = ["ANN"]
# Not annotated yet: removed in phase B-3 and B-4 of the typing spec.
"src/abeliantensors/abeliantensor.py" = ["E741", "ANN"]
"src/abeliantensors/tensor.py" = ["ANN"]

[tool.pyright]
include = ["src", "tests/typing"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
